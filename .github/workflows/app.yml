name: app

on:
  push:
    branches: [main]
    paths: ["app/**", "shared/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "shared/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/app.yml"]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check shared
        run: pnpm --filter @casafit/shared exec tsc --noEmit

      - name: Type-check app
        run: pnpm --filter @casafit/app exec tsc --noEmit

      - name: Jest
        run: pnpm --filter @casafit/app exec jest --ci
