buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: 'org.jetbrains.kotlin.android'
apply from: '../nitrogen/generated/android/CasafitPose+autolinking.gradle'

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["CasafitPose_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["CasafitPose_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.casafit.pose"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
            "META-INF",
            "META-INF/**",
            "**/libc++_shared.so",
            "**/libNitroModules.so",
            "**/libVisionCamera.so",
            "**/libfbjni.so",
            "**/libjsi.so",
            "**/libfolly_json.so",
            "**/libfolly_runtime.so",
            "**/libglog.so",
            "**/libhermes.so",
            "**/libhermes-executor-debug.so",
            "**/libhermes_executor.so",
            "**/libreactnative.so",
            "**/libreactnativejni.so",
            "**/libturbomodulejsijni.so",
            "**/libreact_nativemodule_core.so",
            "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      // The bundled model. No downloader anywhere in the module.
      assets.srcDirs += ["../assets"]
      if (isNewArchitectureEnabled()) {
        java.srcDirs += [
          // React Codegen files
          "${project.buildDir}/generated/source/codegen/java"
        ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

// Fail fast, before anything compiles, when the model asset is missing or is not the pinned file.
tasks.register("verifyPoseModel") {
  def model = file("../assets/pose_landmarker_lite.task")
  def pin = file("../pose_landmarker_lite.task.sha256")
  doLast {
    if (!pin.exists()) throw new GradleException("casafit-pose: pose_landmarker_lite.task.sha256 is missing.")
    if (!model.exists()) {
      throw new GradleException("casafit-pose: model asset missing. Run `node app/modules/casafit-pose/scripts/fetch-model.mjs` (see MODEL.md).")
    }
    def expected = pin.text.trim().split(/\s+/)[0]
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    model.withInputStream { s ->
      byte[] buf = new byte[65536]
      int n
      while ((n = s.read(buf)) > 0) digest.update(buf, 0, n)
    }
    def actual = digest.digest().collect { String.format("%02x", it) }.join()
    if (actual != expected) {
      throw new GradleException("casafit-pose: pose_landmarker_lite.task does not match the pinned SHA-256 (expected ${expected}, got ${actual}). Run `node app/modules/casafit-pose/scripts/fetch-model.mjs`.")
    }
  }
}
preBuild.dependsOn("verifyPoseModel")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")

  // Add a dependency on VisionCamera (HybridFrameSpec and NativeFrame, the Frame we read)
  implementation project(":react-native-vision-camera")

  // ImageProxy is part of NativeFrame's signature. VisionCamera keeps CameraX as `implementation`,
  // so compile against it here; the runtime copy comes from VisionCamera (same version).
  compileOnly "androidx.camera:camera-core:1.7.0-alpha03"

  // MediaPipe Pose Landmarker, pinned. 1.1.1 is the version the spike used (Google Maven also lists
  // 1.2.2); move up only with a device re-test.
  implementation "com.google.mediapipe:tasks-vision:1.1.1"
}
