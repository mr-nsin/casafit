# Local stack: api + Postgres 16.   docker compose up --build   (run from api/)
# The api listens on http://localhost:5080. Secrets here are for local use only.
services:
  api:
    build:
      context: ..            # repo root: the image copies app/assets/content
      dockerfile: api/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=casafit;Username=casafit;Password=casafit"
      # Replace with your Supabase project values. The JWT secret is optional when the project signs with asymmetric keys (JWKS).
      Supabase__Url: "https://your-project.supabase.co"
      Supabase__JwtSecret: "local-compose-supabase-jwt-secret-0123456789"
      Supabase__ServiceRoleKey: "local-compose-service-role-key"
      Auth__Pepper: "local-compose-pepper-0123456789"
      RevenueCat__WebhookSecret: "local-compose-revenuecat-webhook-secret"
      Database__MigrateOnStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: casafit
      POSTGRES_PASSWORD: casafit
      POSTGRES_DB: casafit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casafit -d casafit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
