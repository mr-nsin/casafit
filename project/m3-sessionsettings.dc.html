<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 session sound and voice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.m3 label:focus-within{outline:3px solid var(--p);outline-offset:2px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--c3)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.4)"></div>
  <div role="dialog" aria-label="Sound and voice" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--c1); border-radius: 28px 28px 0 0; box-sizing: border-box; padding: 0 16px 24px; animation: up .4s cubic-bezier(.2,0,0,1) both">
    <div aria-hidden="true" style="margin: 12px auto 0; width: 32px; height: 4px; border-radius: 2px; background: var(--olv)"></div>
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between"><h1 style="margin: 0 0 0 8px; font-size: 22px; line-height: 28px; font-weight: 600">Sound and voice</h1><a href="m3-paused.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">close</span></a></div>

    <label style="min-height: 64px; box-sizing: border-box; display: flex; gap: 14px; align-items: center; padding: 6px 8px"><span class="ms" aria-hidden="true" style="color: var(--p)">record_voice_over</span><span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 500">Voice coach</span><span style="display: block; font-size: 13px; color: var(--osv)">Cues and count-ins, screen off too</span></span><span style="position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--p); flex: none"><span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: var(--op)"></span><input type="checkbox" role="switch" checked aria-label="Voice coach" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0"></span></label>
    <a href="m3-language.dc.html" style="min-height: 56px; display: flex; gap: 14px; align-items: center; padding: 0 8px; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true" style="color: var(--p)">translate</span><span style="flex: 1; font-size: 16px; font-weight: 500">Coach language</span><span style="font-size: 14px; color: var(--osv)">English</span><span class="ms" aria-hidden="true" style="color: var(--osv)">chevron_right</span></a>
    <label style="min-height: 64px; box-sizing: border-box; display: flex; gap: 14px; align-items: center; padding: 6px 8px"><span class="ms" aria-hidden="true" style="color: var(--p)">music_note</span><span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 500">Lower music while the coach talks</span><span style="display: block; font-size: 13px; color: var(--osv)">Your music keeps playing</span></span><span style="position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--p); flex: none"><span style="position: absolute; right: 4px; top: 4px; width: 24px; height: 24px; border-radius: 12px; background: var(--op)"></span><input type="checkbox" role="switch" checked aria-label="Lower music while the coach talks" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0"></span></label>
    <label style="min-height: 64px; box-sizing: border-box; display: flex; gap: 14px; align-items: center; padding: 6px 8px; background: var(--tc); color: var(--otc); border-radius: 18px"><span class="ms f" aria-hidden="true">volume_off</span><span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 600">Quiet mode</span><span style="display: block; font-size: 13px">No jumping moves. Vibration instead of beeps. Good for flats and late nights.</span></span><span style="position: relative; width: 52px; height: 32px; box-sizing: border-box; border-radius: 16px; border: 2px solid var(--otc); flex: none"><span style="position: absolute; left: 6px; top: 6px; width: 16px; height: 16px; border-radius: 8px; background: var(--otc)"></span><input type="checkbox" role="switch" aria-label="Quiet mode" style="position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0"></span></label>

    <h2 style="margin: 16px 8px 8px; font-size: 14px; line-height: 20px; font-weight: 600">Rest between sets</h2>
    <div role="radiogroup" aria-label="Rest between sets" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 48px; border: 1px solid var(--ol); border-radius: 24px; overflow: hidden">
      <button role="radio" aria-checked="false" style="border: 0; background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">15 s</button>
      <button role="radio" aria-checked="true" style="border: 0; border-left: 1px solid var(--ol); border-right: 1px solid var(--ol); background: var(--sc); color: var(--osc); display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>20 s</button>
      <button role="radio" aria-checked="false" style="border: 0; background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">30 s</button>
    </div>
    <div style="margin: 8px 8px 0; font-size: 12px; line-height: 16px; color: var(--osv)">Longer rests may push today past 15 minutes. We show the new total before you start.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.dark ?? true) ? 'dark' : '' };
  }
}
</script>
</body>
</html>
