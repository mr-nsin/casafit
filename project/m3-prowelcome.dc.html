<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 welcome to Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@keyframes ring{from{transform:scale(.6);opacity:.7}to{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 72px 24px 24px; display: flex; flex-direction: column">
    <div style="position: relative; align-self: center; width: 140px; height: 140px; display: flex; align-items: center; justify-content: center">
      <span aria-hidden="true" style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--p); animation: ring 1.4s cubic-bezier(.2,0,0,1) .3s 2 both"></span>
      <span style="width: 120px; height: 120px; border-radius: 40px; background: var(--p); color: var(--op); display: flex; align-items: center; justify-content: center; animation: pop .7s cubic-bezier(.2,0,0,1) both"><span class="ms f" aria-hidden="true" style="font-size: 64px; width: 64px; height: 64px">verified</span></span>
    </div>
    <h1 style="margin: 28px 0 0; font-size: 36px; line-height: 42px; font-weight: 800; letter-spacing: -0.6px; text-align: center">You're on Pro</h1>
    <p style="margin: 10px 0 0; font-size: 16px; line-height: 24px; color: var(--osv); text-align: center">Yearly plan · renews 19 October 2027. Thank you for backing CasaFit.</p>

    <div style="margin-top: 28px; display: flex; flex-direction: column; gap: 8px">
      <div style="min-height: 60px; display: flex; gap: 14px; align-items: center; background: var(--c3); border-radius: 18px; padding: 10px 16px; animation: rise .5s cubic-bezier(.2,0,0,1) .5s both"><span class="ms f" aria-hidden="true" style="color: var(--p)">photo_camera</span><span style="font-size: 16px">Unlimited form checks, still on your phone</span></div>
      <div style="min-height: 60px; display: flex; gap: 14px; align-items: center; background: var(--c3); border-radius: 18px; padding: 10px 16px; animation: rise .5s cubic-bezier(.2,0,0,1) .65s both"><span class="ms f" aria-hidden="true" style="color: var(--p)">devices</span><span style="font-size: 16px">Comes back on any phone you verify</span></div>
      <div style="min-height: 60px; display: flex; gap: 14px; align-items: center; background: var(--c3); border-radius: 18px; padding: 10px 16px; animation: rise .5s cubic-bezier(.2,0,0,1) .8s both"><span class="ms f" aria-hidden="true" style="color: var(--p)">cancel</span><span style="font-size: 16px">Cancel any time in two taps</span></div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <a href="m3-form.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500"><span class="ms f" aria-hidden="true">photo_camera</span>Try a form check</a>
      <a href="m3-home.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 28px; color: var(--p); text-decoration: none; font-size: 16px; font-weight: 500">Back to home</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
