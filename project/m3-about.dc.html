<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 onboarding about you</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes grow{from{stroke-dasharray:0 1000}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes fillbar{from{width:0}}
.m3 label:focus-within{outline:3px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 8px 16px 20px; display: flex; flex-direction: column">

    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-goals.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">arrow_back</span></a>
      <span style="font-size: 14px; font-weight: 500; color: var(--osv); padding-right: 12px">2 of 2</span>
    </div>
    <div role="progressbar" aria-label="Onboarding progress" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" style="height: 4px; border-radius: 2px; background: var(--sv); margin: 0 8px"><div style="width: 100%; height: 100%; border-radius: 2px; background: var(--p)"></div></div>

    <h1 style="margin: 14px 8px 0; font-size: 28px; line-height: 36px; font-weight: 700; letter-spacing: -0.2px">About you</h1>

    <div style="margin-top: 14px; display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 1fr); gap: 8px">
      <div style="position: relative; height: 56px; box-sizing: border-box; border: 1px solid var(--ol); border-radius: 4px">
        <label for="age" style="position: absolute; left: 10px; top: -9px; padding: 0 4px; background: var(--bg); font-size: 12px; color: var(--osv)">Age</label>
        <input id="age" type="number" value="28" style="width: 100%; height: 100%; box-sizing: border-box; border: 0; background: transparent; padding: 0 14px; font: 400 16px 'Roboto Flex', sans-serif; color: var(--on); outline: none">
      </div>
      <div style="position: relative; height: 56px; box-sizing: border-box; border: 1px solid var(--ol); border-radius: 4px">
        <label for="height" style="position: absolute; left: 10px; top: -9px; padding: 0 4px; background: var(--bg); font-size: 12px; color: var(--osv)">Height · cm</label>
        <input id="height" type="number" value="162" style="width: 100%; height: 100%; box-sizing: border-box; border: 0; background: transparent; padding: 0 14px; font: 400 16px 'Roboto Flex', sans-serif; color: var(--on); outline: none">
      </div>
      <div style="position: relative; height: 56px; box-sizing: border-box; border: 1px dashed var(--ol); border-radius: 4px">
        <label for="weight" style="position: absolute; left: 10px; top: -9px; padding: 0 4px; background: var(--bg); font-size: 12px; color: var(--osv)">Weight · kg</label>
        <input id="weight" type="number" placeholder="Skip" style="width: 100%; height: 100%; box-sizing: border-box; border: 0; background: transparent; padding: 0 14px; font: 400 16px 'Roboto Flex', sans-serif; color: var(--on); outline: none">
      </div>
    </div>

    <div style="margin: 14px 8px 0; font-size: 12px; font-weight: 500; color: var(--osv)">Sex</div>
    <div style="margin-top: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border: 1px solid var(--ol); border-radius: 22px; overflow: hidden">
      <button aria-pressed="true" style="border: 0; background: var(--sc); color: var(--osc); display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>Woman</button>
      <button style="border: 0; border-left: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Man</button>
      <button style="border: 0; border-left: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Other</button>
    </div>

    <div style="margin: 14px 8px 0; font-size: 12px; font-weight: 500; color: var(--osv)">Training experience</div>
    <div style="margin-top: 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 44px; border: 1px solid var(--ol); border-radius: 22px; overflow: hidden">
      <button style="border: 0; background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">New</button>
      <button aria-pressed="true" style="border: 0; border-left: 1px solid var(--ol); background: var(--sc); color: var(--osc); display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>On and off</button>
      <button style="border: 0; border-left: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Regular</button>
    </div>

    <div style="margin: 14px 8px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--osv)"><span>Days a week</span><span style="color: var(--p); font-weight: 700; font-size: 14px">4 days</span></div>
    <div role="slider" aria-label="Days per week" aria-valuemin="3" aria-valuemax="7" aria-valuenow="4" style="position: relative; margin: 6px 8px 0; height: 44px">
      <div style="position: absolute; left: 0; right: 0; top: 18px; height: 8px; border-radius: 4px; background: var(--sv)"></div>
      <div style="position: absolute; left: 0; width: 25%; top: 18px; height: 8px; border-radius: 4px 0 0 4px; background: var(--p)"></div>
      <div style="position: absolute; left: 0; right: 0; top: 21px; display: flex; justify-content: space-between; padding: 0 2px"><span style="width: 2px; height: 2px; border-radius: 50%; background: var(--op)"></span><span style="width: 2px; height: 2px; border-radius: 50%; background: var(--op)"></span><span style="width: 2px; height: 2px; border-radius: 50%; background: var(--p)"></span><span style="width: 2px; height: 2px; border-radius: 50%; background: var(--p)"></span><span style="width: 2px; height: 2px; border-radius: 50%; background: var(--p)"></span></div>
      <div style="position: absolute; left: 25%; top: 10px; width: 4px; height: 24px; margin-left: -2px; border-radius: 2px; background: var(--p)"></div>
    </div>
    <div style="margin: 0 8px; display: flex; justify-content: space-between; font-size: 12px; color: var(--osv)"><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>

    <div style="margin: 12px 8px 0; font-size: 12px; font-weight: 500; color: var(--osv)">Any pain or past injury?</div>
    <div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px">
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">None</button>
      <button aria-pressed="true" style="height: 44px; padding: 0 14px 0 8px; border-radius: 12px; border: 0; background: var(--sc); color: var(--osc); display: flex; align-items: center; gap: 4px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>Knees</button>
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Back</button>
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Shoulders</button>
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Wrists</button>
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Other</button>
    </div>
    <div style="margin: 6px 8px 0; font-size: 12px; color: var(--osv)">We'll skip lunges and tell you why.</div>

    <div style="margin: 10px 8px 0; font-size: 12px; font-weight: 500; color: var(--osv)">Anything we should know?</div>
    <div style="margin-top: 6px; display: flex; flex-wrap: wrap; gap: 8px">
      <a href="m3-health.dc.html" style="text-decoration: none; display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Heart or BP</a>
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Pregnancy or postpartum</button>
      <button style="height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Recent surgery</button>
      <button aria-pressed="true" style="height: 44px; padding: 0 14px 0 8px; border-radius: 12px; border: 0; background: var(--sc); color: var(--osc); display: flex; align-items: center; gap: 4px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>None</button>
    </div>

    <label style="margin: 8px 0 0; min-height: 48px; display: flex; gap: 8px; align-items: center; font-size: 13px; line-height: 18px">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0 14px 0 8px; accent-color: #9C4400; flex: none">
      Use my health answers only to keep my plan safe.
    </label>

    <a href="m3-building.dc.html" style="margin-top: auto; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500"><span class="ms f" aria-hidden="true">auto_awesome</span>Build my plan</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
