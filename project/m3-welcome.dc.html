<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes grow{from{stroke-dasharray:0 1000}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes fillbar{from{width:0}}
.m3 label:focus-within{outline:3px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">

  <div aria-hidden="true" style="position: absolute; width: 330px; height: 330px; border-radius: 50%; background: var(--pc); left: 30px; top: 70px"></div>
  <div aria-hidden="true" style="position: absolute; width: 150px; height: 150px; border-radius: 42px; background: var(--tc); right: 14px; top: 56px; transform: rotate(14deg)"></div>
  <div aria-hidden="true" style="position: absolute; width: 112px; height: 112px; border-radius: 50%; background: var(--sc); left: 8px; top: 330px"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 40px; height: 40px; border-radius: 14px; background: var(--p); color: var(--op); display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true">home</span></span>
        <span style="font-size: 22px; font-weight: 600; letter-spacing: -0.2px">casafit</span>
      </div>
      <a href="m3-verify.dc.html" style="height: 48px; padding: 0 16px; display: flex; align-items: center; border-radius: 24px; text-decoration: none; font-size: 14px; font-weight: 500; color: var(--p)">Log in</a>
    </div>

    <div style="margin-top: 38px; display: flex; flex-direction: column; align-items: center; text-align: center">
      <div style="font-size: 176px; line-height: 0.9; font-weight: 800; animation: pop .8s cubic-bezier(.2,0,0,1) both; letter-spacing: -8px; color: var(--opc); font-variation-settings: 'opsz' 144">15</div>
      <div style="margin-top: 6px; font-size: 22px; font-weight: 500; color: var(--opc); ">minutes</div>
    </div>

    <div style="margin-top: auto">
      <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.3px">A whole workout, at home, with nothing but you.</h1>
      <p style="margin: 10px 0 0; font-size: 16px; line-height: 24px; color: var(--osv)">Every session starts with a matched warm-up and ends with a cool-down.</p>

      <div style="margin-top: 18px; display: flex; height: 52px; border-radius: 16px; overflow: hidden; animation: reveal 1s cubic-bezier(.2,0,0,1) .5s both; font-size: 12px; font-weight: 500">
        <div style="flex: 2; background: var(--tc); color: var(--otc); display: flex; flex-direction: column; justify-content: center; padding-left: 10px"><span>Warm-up</span><span style="font-weight: 700">2</span></div>
        <div style="flex: 11; background: var(--p); color: var(--op); display: flex; flex-direction: column; justify-content: center; padding-left: 12px"><span>Work</span><span style="font-weight: 700">11 min</span></div>
        <div style="flex: 2; background: var(--sc); color: var(--osc); display: flex; flex-direction: column; justify-content: center; padding-left: 10px"><span>Cool</span><span style="font-weight: 700">2</span></div>
      </div>

      <a href="m3-age.dc.html" style="margin-top: 20px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500">
        Get my 15-minute plan <span class="ms" aria-hidden="true">arrow_forward</span>
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
