<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 progress for a new user</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes shimmer{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="box-sizing: border-box; padding: 8px 16px 0; display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center"><h1 style="margin: 0 0 0 4px; font-size: 28px; line-height: 32px; font-weight: 700">Progress</h1></div>

    <div style="margin-top: 8px; background: var(--pc); color: var(--opc); border-radius: 28px; padding: 22px 20px; position: relative; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; right: -30px; top: -30px; width: 140px; height: 140px; border-radius: 50%; background: var(--sc)"></div>
      <span class="ms f" aria-hidden="true" style="position: relative; font-size: 40px; width: 40px; height: 40px">flag</span>
      <div style="position: relative; margin-top: 8px; font-size: 26px; line-height: 32px; font-weight: 700">Your progress starts with session one</div>
      <p style="position: relative; margin: 8px 0 0; font-size: 15px; line-height: 22px">After your first workout you will see minutes, streaks and steps here. Weight is optional and shown only as a trend.</p>
    </div>

    <h2 style="margin: 20px 8px 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--osv)">What will show up here</h2>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="height: 76px; border-radius: 20px; background: var(--c3); animation: shimmer 2.4s ease-in-out infinite"></div>
      <div style="height: 76px; border-radius: 20px; background: var(--c3); animation: shimmer 2.4s ease-in-out .3s infinite"></div>
      <div style="height: 76px; border-radius: 20px; background: var(--c3); animation: shimmer 2.4s ease-in-out .6s infinite"></div>
    </div>
    <div aria-hidden="true" style="margin-top: 8px; height: 150px; border-radius: 24px; background: var(--c3); display: flex; align-items: flex-end; gap: 10px; padding: 16px; box-sizing: border-box">
      <span style="flex: 1; height: 30%; border-radius: 8px; background: var(--c4)"></span><span style="flex: 1; height: 45%; border-radius: 8px; background: var(--c4)"></span><span style="flex: 1; height: 25%; border-radius: 8px; background: var(--c4)"></span><span style="flex: 1; height: 55%; border-radius: 8px; background: var(--c4)"></span><span style="flex: 1; height: 35%; border-radius: 8px; background: var(--c4)"></span><span style="flex: 1; height: 50%; border-radius: 8px; background: var(--c4)"></span><span style="flex: 1; height: 40%; border-radius: 8px; background: var(--c4)"></span>
    </div>
    <div style="margin-top: 20px"><a href="m3-player.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500"><span class="ms f" aria-hidden="true">play_arrow</span>Start today's session</a></div>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: var(--c2); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-top: 12px; box-sizing: border-box">
    <a href="m3-home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--osv); font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">sports_gymnastics</span></span>Workout</a>
    <a href="m3-nutrition.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--osv); font-size: 12px; font-weight: 500"><span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><span class="ms" aria-hidden="true">restaurant</span></span>Nutrition</a>
    <a href="m3-progress.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--on); font-size: 12px; font-weight: 600"><span style="width: 64px; height: 32px; border-radius: 16px; background: var(--sc); color: var(--osc); display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true">bar_chart</span></span>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
