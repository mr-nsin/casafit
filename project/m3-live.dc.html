<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 live form analysis</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #0D0A08; color: #F0DFD5; font-family: 'Roboto Flex', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #3a2a20 0%, #0D0A08 70%)"></div>

  <div style="position: relative; box-sizing: border-box; padding: 8px 16px 0">
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-formresult.dc.html" aria-label="Stop analysis" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; color: #F0DFD5; text-decoration: none"><span class="ms" aria-hidden="true">close</span></a>
      <span style="height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 8px; background: rgba(255,255,255,0.12); font-size: 13px; font-weight: 500"><span class="ms f" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">photo_camera</span>Squat · free check 1 of 2</span>
      <span style="width: 48px"></span>
    </div>
  </div>

  <svg role="img" aria-label="Body outline in a squat, knees tracking slightly inward" style="position: absolute; left: 50%; top: 150px; transform: translateX(-50%)" width="300" height="400" viewBox="0 0 300 400">
    <g fill="none" stroke="#FFDBC8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <path d="M150 90v90"></path><path d="M150 112L108 148M150 112l42 36"></path>
      <path d="M150 180L112 232 128 330M150 180l38 52-16 98"></path>
    </g>
    <circle cx="150" cy="66" r="20" fill="none" stroke="#FFDBC8" stroke-width="6"></circle>
    <g fill="#E4E790"><circle cx="150" cy="112" r="7"></circle><circle cx="108" cy="148" r="6"></circle><circle cx="192" cy="148" r="6"></circle><circle cx="150" cy="180" r="7"></circle><circle cx="128" cy="330" r="6"></circle><circle cx="172" cy="330" r="6"></circle></g>
    <g fill="#FFB4AB" style="transform-origin: 112px 232px; animation: breathe 1.6s ease-in-out infinite"><circle cx="112" cy="232" r="10"></circle></g>
    <circle cx="188" cy="232" r="7" fill="#E4E790"></circle>
    <path d="M40 360h220" stroke="#FFDBCA" stroke-opacity=".25" stroke-width="3" stroke-dasharray="4 8"></path>
  </svg>

  <div role="status" aria-live="polite" style="position: absolute; left: 24px; right: 24px; top: 520px; display: flex; justify-content: center"><span style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 22px; background: #FFDAD6; color: #410002; font-size: 15px; font-weight: 600; animation: pop .35s cubic-bezier(.2,0,0,1) both"><span class="ms f" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px">priority_high</span>Knees out a little</span></div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 24px; background: #221A15; border-radius: 28px; padding: 16px 16px 16px 20px; display: flex; align-items: center; gap: 16px">
    <div style="flex: 1">
      <div style="font-size: 12px; font-weight: 500; color: #D7C2B8">Reps analysed</div>
      <div style="font-size: 56px; line-height: 56px; font-weight: 800; color: #FFB68E">4</div>
      <div style="margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #E4E790"><span class="ms f" aria-hidden="true" style="font-size: 16px; width: 16px; height: 16px">check_circle</span>3 reps done. This check now counts.</div>
    </div>
    <a href="m3-formresult.dc.html" style="height: 56px; padding: 0 22px; box-sizing: border-box; display: flex; align-items: center; border-radius: 28px; background: #FFB68E; color: #552100; text-decoration: none; font-size: 15px; font-weight: 600">See result</a>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 148px; display: flex; justify-content: center; font-size: 12px; color: #D7C2B8"><span style="display: flex; align-items: center; gap: 6px"><span class="ms" aria-hidden="true" style="font-size: 16px; width: 16px; height: 16px">videocam_off</span>Nothing is recorded or saved</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.dark ?? true) ? 'dark' : '' };
  }
}
</script>
</body>
</html>
