<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 building your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes grow{from{stroke-dasharray:0 1000}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes fillbar{from{width:0}}
.m3 label:focus-within{outline:3px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div aria-hidden="true" style="position: absolute; width: 300px; height: 300px; border-radius: 50%; background: var(--c3); left: -110px; top: -90px"></div>
  <div aria-hidden="true" style="position: absolute; width: 140px; height: 140px; border-radius: 44px; background: var(--tc); right: -40px; top: 90px; transform: rotate(18deg); opacity: 0.7"></div>

  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 56px 24px 28px; display: flex; flex-direction: column; align-items: center">

    <div style="position: relative; width: 224px; height: 224px">
      <svg width="224" height="224" viewBox="0 0 224 224" role="img" aria-label="Plan 78 percent built">
        <circle cx="112" cy="112" r="96" fill="var(--pc)"></circle>
        <circle cx="112" cy="112" r="96" fill="none" stroke="var(--sv)" stroke-width="12"></circle>
        <circle cx="112" cy="112" r="96" fill="none" stroke="var(--p)" stroke-width="12" stroke-linecap="round" stroke-dasharray="471 603" transform="rotate(-90 112 112)" style="animation: grow 1.3s cubic-bezier(.2,0,0,1) both"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--opc)">
        <span style="font-size: 64px; line-height: 64px; font-weight: 700; letter-spacing: -2px">78<span style="font-size: 28px; letter-spacing: 0">%</span></span>
        <span style="font-size: 14px; font-weight: 500">built</span>
      </div>
    </div>

    <h1 style="margin: 28px 0 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.3px; text-align: center">Cooking up your week one</h1>
    <p style="margin: 8px 0 0; font-size: 16px; line-height: 24px; color: var(--osv); text-align: center">Rules on your phone build this, so it works offline.</p>

    <ul style="list-style: none; margin: 24px 0 0; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 8px">
      <li style="animation: rise .55s cubic-bezier(.2,0,0,1) 0.3s both; min-height: 56px; display: flex; gap: 16px; align-items: center; background: var(--c2); border-radius: 16px; padding: 8px 16px">
        <span class="ms f" aria-hidden="true" style="color: var(--t)">check_circle</span>
        <span style="font-size: 16px">4 days: 3 Normal, 1 Yoga</span>
      </li>
      <li style="animation: rise .55s cubic-bezier(.2,0,0,1) 0.7s both; min-height: 56px; display: flex; gap: 16px; align-items: center; background: var(--c2); border-radius: 16px; padding: 8px 16px">
        <span class="ms f" aria-hidden="true" style="color: var(--t)">check_circle</span>
        <span style="font-size: 16px">Skipping lunges because of your knee</span>
      </li>
      <li style="animation: rise .55s cubic-bezier(.2,0,0,1) 1.1s both; min-height: 56px; display: flex; gap: 16px; align-items: center; background: var(--pc); color: var(--opc); border-radius: 16px; padding: 8px 16px">
        <span style="width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--p); border-top-color: transparent; flex: none; animation: spin .9s linear infinite"></span>
        <span style="font-size: 16px; font-weight: 600">Matching warm-ups to core and glutes</span>
      </li>
      <li style="animation: rise .55s cubic-bezier(.2,0,0,1) 1.5s both; min-height: 56px; display: flex; gap: 16px; align-items: center; border: 1px solid var(--olv); border-radius: 16px; padding: 8px 16px; color: var(--osv)">
        <span class="ms" aria-hidden="true">radio_button_unchecked</span>
        <span style="font-size: 16px">Building matching cool-downs</span>
      </li>
    </ul>

    <a href="m3-weekone.dc.html" style="margin-top: auto; height: 56px; width: 100%; display: flex; align-items: center; justify-content: center; border-radius: 28px; background: var(--sc); color: var(--osc); text-decoration: none; font-size: 16px; font-weight: 500">See my plan</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
