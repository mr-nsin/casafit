<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 onboarding goals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes grow{from{stroke-dasharray:0 1000}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0 round 16px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(1.045)}}
@keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes fillbar{from{width:0}}
.m3 label:focus-within{outline:3px solid var(--p);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 8px 16px 24px; display: flex; flex-direction: column">

    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-verify.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">arrow_back</span></a>
      <span style="font-size: 14px; font-weight: 500; color: var(--osv); padding-right: 12px">1 of 2</span>
    </div>
    <div role="progressbar" aria-label="Onboarding progress" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="height: 4px; border-radius: 2px; background: var(--sv); margin: 0 8px"><div style="width: 50%; height: 100%; border-radius: 2px; background: var(--p)"></div></div>

    <h1 style="margin: 20px 8px 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.3px">What do you want?</h1>

    <div style="margin: 20px 8px 0; font-size: 14px; font-weight: 500; color: var(--osv)">Your goal</div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="text-align: left; height: 96px; padding: 14px 16px; border-radius: 20px; border: 1px solid var(--olv); background: var(--c1); color: var(--on); display: flex; flex-direction: column; justify-content: space-between; font: 500 16px 'Roboto Flex', sans-serif">
        <span class="ms" aria-hidden="true" style="color: var(--p)">accessibility_new</span>Stay fit, full body
      </button>
      <button aria-pressed="true" style="position: relative; text-align: left; height: 96px; padding: 14px 16px; border-radius: 20px; border: 0; background: var(--pc); color: var(--opc); display: flex; flex-direction: column; justify-content: space-between; font: 600 16px 'Roboto Flex', sans-serif">
        <span class="ms f" aria-hidden="true">target</span>Train specific body parts
        <span class="ms f" aria-hidden="true" style="position: absolute; top: 12px; right: 12px">check_circle</span>
      </button>
    </div>

    <div style="margin: 24px 8px 0; display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; color: var(--osv)"><span>Which body parts?</span><span style="font-weight: 400">Up to 2</span></div>
    <div style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px">
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Arms</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Chest</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Back</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Shoulders</button>
      <button aria-pressed="true" style="height: 44px; padding: 0 16px 0 10px; border-radius: 12px; border: 0; background: var(--sc); color: var(--osc); display: flex; align-items: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>Core</button>
      <button aria-pressed="true" style="height: 44px; padding: 0 16px 0 10px; border-radius: 12px; border: 0; background: var(--sc); color: var(--osc); display: flex; align-items: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>Glutes</button>
      <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Legs</button>
    </div>

    <div style="margin: 24px 8px 0; display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; color: var(--osv)"><span>What do you enjoy?</span><span style="font-weight: 400">One, two or all three</span></div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <button aria-pressed="true" style="position: relative; height: 112px; padding: 12px; border-radius: 20px; border: 0; background: var(--pc); color: var(--opc); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; font: 600 15px 'Roboto Flex', sans-serif">
        <span class="ms f" aria-hidden="true" style="font-size: 32px; width: 32px; height: 32px">sports_gymnastics</span>Normal
        <span class="ms f" aria-hidden="true" style="position: absolute; top: 8px; right: 8px; font-size: 20px; width: 20px; height: 20px">check_circle</span>
      </button>
      <button style="height: 112px; padding: 12px; border-radius: 20px; border: 1px solid var(--olv); background: var(--c1); color: var(--on); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; font: 500 15px 'Roboto Flex', sans-serif">
        <span class="ms" aria-hidden="true" style="font-size: 32px; width: 32px; height: 32px; color: var(--p)">music_note</span>Dance
      </button>
      <button aria-pressed="true" style="position: relative; height: 112px; padding: 12px; border-radius: 20px; border: 0; background: var(--pc); color: var(--opc); display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; font: 600 15px 'Roboto Flex', sans-serif">
        <span class="ms f" aria-hidden="true" style="font-size: 32px; width: 32px; height: 32px">self_improvement</span>Yoga
        <span class="ms f" aria-hidden="true" style="position: absolute; top: 8px; right: 8px; font-size: 20px; width: 20px; height: 20px">check_circle</span>
      </button>
    </div>
    <p style="margin: 10px 8px 0; font-size: 12px; line-height: 16px; color: var(--osv)">Pick two and we split your week between them. Pick all three and <a href="m3-mix.dc.html" style="color: var(--p)">you choose the mix</a>.</p>

    <a href="m3-about.dc.html" style="margin-top: auto; height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500">Next: about you <span class="ms" aria-hidden="true">arrow_forward</span></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
