<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nutrition, food log</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.d{font-family:'Anton',Impact,sans-serif;font-weight:400}
.h{font-family:'Baloo 2',sans-serif;font-weight:800}
a{color:#15121F}a:hover{color:#3046FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #FFB627; font-family: 'Bricolage Grotesque', sans-serif; color: #15121F">

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 300px; bottom: 0; background: #FFF6E8; border-top: 3px solid #15121F; border-radius: 34px 34px 0 0"></div>
  <div aria-hidden="true" style="position: absolute; right: -40px; top: 40px; width: 150px; height: 150px; border-radius: 50%; background-image: radial-gradient(#15121F 2px, transparent 2.5px); background-size: 12px 12px; opacity: 0.4"></div>

  <div style="position: relative; padding: 22px 18px 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div>
        <div style="font-size: 13px; font-weight: 800; letter-spacing: 1.5px">MONDAY</div>
        <h1 class="d" style="margin: 2px 0 0; font-size: 38px; line-height: 1; text-transform: uppercase">Nutrition</h1>
      </div>
      <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; background: #FFF; border: 2px solid #15121F; border-radius: 999px; padding: 6px 6px 6px 12px">
        Hide calories
        <input type="checkbox" role="switch" style="width: 40px; height: 24px; accent-color: #15121F; margin: 0">
      </label>
    </div>

    <div style="margin-top: 14px; background: #15121F; color: #FFF; border-radius: 26px; padding: 16px; box-shadow: 6px 6px 0 #FF4F9A">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div>
          <div style="font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #C6F432">PROTEIN</div>
          <div><span class="d" style="font-size: 60px; line-height: 1">52</span><span class="d" style="font-size: 26px; color: #D9D3E8"> / 70 g</span></div>
        </div>
        <div style="text-align: right">
          <div style="font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #D9D3E8">CALORIES</div>
          <div><span class="d" style="font-size: 28px">1,240</span><span style="font-size: 14px; font-weight: 600; color: #D9D3E8"> / 1,800</span></div>
        </div>
      </div>
      <div style="margin-top: 10px; height: 22px; border-radius: 11px; background: #3A3252; overflow: hidden; border: 2px solid #FFF">
        <div style="width: 74%; height: 100%; background-color: #C6F432; background-image: repeating-linear-gradient(135deg, rgba(21,18,31,0.25) 0 6px, transparent 6px 12px)"></div>
      </div>
      <div style="margin-top: 6px; font-size: 13px; color: #D9D3E8">18 g of protein to go today</div>
    </div>

    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 48px; border-radius: 999px; background: #FFF; border: 2px solid #15121F; box-shadow: 3px 3px 0 #15121F; font: 800 15px 'Bricolage Grotesque', sans-serif; color: #15121F">Same as yesterday</button>
      <button style="height: 48px; border-radius: 999px; background: #FFF; border: 2px solid #15121F; box-shadow: 3px 3px 0 #15121F; font: 800 15px 'Bricolage Grotesque', sans-serif; color: #15121F">Saved meals</button>
    </div>

    <label for="food-search" style="margin-top: 14px; display: flex; align-items: center; gap: 10px; height: 52px; box-sizing: border-box; background: #FFF; border: 2px solid #15121F; border-radius: 16px; padding: 0 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="food-search" type="search" placeholder="Search dal, roti, idli, poha…" style="flex: 1; min-width: 0; border: 0; font: 600 16px 'Bricolage Grotesque', sans-serif; color: #15121F; background: transparent">
    </label>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
      <div style="background: #FFF; border: 2px solid #15121F; border-radius: 18px; padding: 10px 12px; display: flex; gap: 12px; align-items: center">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #C6F432; border: 2px solid #15121F; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path></svg></span>
        <div style="flex: 1">
          <div style="font-weight: 800; font-size: 15px">Breakfast</div>
          <div style="font-size: 13px; color: #4A4458">Poha · 1 katori, Chai · 1 cup</div>
        </div>
        <span class="d" style="font-size: 18px">12 g</span>
      </div>
      <div style="background: #FFF; border: 2px solid #15121F; border-radius: 18px; padding: 10px 12px; display: flex; gap: 12px; align-items: center">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #FF4F9A; border: 2px solid #15121F; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0z"></path></svg></span>
        <div style="flex: 1">
          <div style="font-weight: 800; font-size: 15px">Lunch</div>
          <div style="font-size: 13px; color: #4A4458">Dal · 1 katori, Roti · 2, Bhindi · 1 katori</div>
        </div>
        <span class="d" style="font-size: 18px">22 g</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button style="height: 52px; border-radius: 18px; border: 2px dashed #15121F; background: transparent; font: 800 15px 'Bricolage Grotesque', sans-serif; color: #15121F">+ Snack</button>
        <button style="height: 52px; border-radius: 18px; border: 2px dashed #15121F; background: transparent; font: 800 15px 'Bricolage Grotesque', sans-serif; color: #15121F">+ Dinner</button>
      </div>
    </div>

    <div style="margin-top: 12px; background: #8FE3FF; border: 2px solid #15121F; border-radius: 18px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; transform: rotate(-1deg)">
      <span class="h" style="background: #15121F; color: #8FE3FF; border-radius: 999px; padding: 2px 10px 0; font-size: 15px; flex: none">टिप</span>
      <span style="font-size: 14px; font-weight: 600; line-height: 1.3">Add a protein: a katori of curd with dinner.</span>
    </div>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #FFF; border-top: 3px solid #15121F; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px 18px 22px; box-sizing: border-box">
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #15121F; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 16px; border: 2px solid #15121F">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"></path></svg>Workout
    </a>
    <a href="Nutrition.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #15121F; color: #C6F432; border-radius: 999px; text-decoration: none; font-weight: 800; font-size: 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C6F432" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"></path></svg>Nutrition
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
