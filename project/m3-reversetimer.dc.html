<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 reverse walk timer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes grow{from{stroke-dasharray:0 1000}}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 8px 16px 24px; display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-endsession.dc.html" aria-label="Stop the bout" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">close</span></a>
      <span style="font-size: 16px; font-weight: 600">Reverse walk</span><span style="width: 48px"></span>
    </div>

    <div style="margin-top: 16px; position: relative; width: 248px; height: 248px; align-self: center">
      <svg width="248" height="248" viewBox="0 0 248 248" role="img" aria-label="5 minutes 42 seconds of a 10 minute bout"><circle cx="124" cy="124" r="108" fill="none" stroke="var(--sv)" stroke-width="16"></circle><circle cx="124" cy="124" r="108" fill="none" stroke="var(--p)" stroke-width="16" stroke-linecap="round" stroke-dasharray="387 679" transform="rotate(-90 124 124)" style="animation: grow 1.3s cubic-bezier(.2,0,0,1) both"></circle></svg>
      <div role="timer" style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 64px; line-height: 64px; font-weight: 700; letter-spacing: -1.5px">5:42</span><span style="font-size: 14px; color: var(--osv)">of 10:00</span></div>
    </div>

    <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: var(--tc); color: var(--otc); border-radius: 20px; padding: 14px 16px"><div style="font-size: 28px; line-height: 32px; font-weight: 700">412</div><div style="font-size: 12px; font-weight: 500">Steps in this bout</div></div>
      <div style="background: var(--sc); color: var(--osc); border-radius: 20px; padding: 14px 16px"><div style="font-size: 28px; line-height: 32px; font-weight: 700">9:18</div><div style="font-size: 12px; font-weight: 500">Left today (15 max)</div></div>
    </div>
    <div style="margin-top: 12px; display: flex; gap: 12px; align-items: center; background: var(--erc); color: var(--eoc); border-radius: 18px; padding: 12px 16px; font-size: 14px; line-height: 20px"><span class="ms f" aria-hidden="true">warning</span>Slow and steady. Stop if you feel dizzy or unsteady.</div>

    <div style="margin-top: auto"><a href="m3-steps.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500"><span class="ms f" aria-hidden="true">stop</span>Stop bout</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
