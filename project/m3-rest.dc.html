<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}

</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
<div style="box-sizing: border-box; padding: 8px 16px 0; display: flex; flex-direction: column"><div style="height: 56px; display: flex; align-items: center; gap: 4px; justify-content: space-between"><div style="display: flex; align-items: center; gap: 4px"><a href="m3-player.dc.html" aria-label="End session" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true" style="">close</span></a></div><span style="font-size: 13px; font-weight: 600; color: var(--p); padding-right: 12px">MOVE 3 OF 5 DONE</span></div>
<div style="margin-top: 8px; text-align: center; font-size: 14px; font-weight: 600; letter-spacing: 2px; color: var(--t)">REST</div>
<div style="margin-top: 16px; position: relative; width: 240px; height: 240px; align-self: center">
<svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="12 seconds of rest left"><circle cx="120" cy="120" r="104" fill="none" stroke="var(--sv)" stroke-width="16"></circle><circle cx="120" cy="120" r="104" fill="none" stroke="var(--t)" stroke-width="16" stroke-linecap="round" stroke-dasharray="392 654" transform="rotate(-90 120 120)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 88px; line-height: 88px; font-weight: 700; letter-spacing: -3px">0:12</span><span style="font-size: 13px; color: var(--osv)">of 0:20 rest</span></div></div>
<div style="margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 52px; border-radius: 16px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 15px 'Roboto Flex', sans-serif">+15s</button>
<button style="height: 52px; border-radius: 16px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 15px 'Roboto Flex', sans-serif">+30s</button></div>
<div style="margin-top: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; color: var(--osv); padding-left: 4px">UP NEXT</div>
<div style="margin-top: 6px; display: flex; gap: 14px; align-items: center; background: var(--tc); color: var(--otc); border-radius: 24px; padding: 14px 16px">
<svg width="72" height="48" viewBox="0 0 72 48" aria-hidden="true"><g fill="none" stroke="var(--otc)" stroke-width="6" stroke-linecap="round"><path d="M12 36h48M22 36V16M50 36V16M22 16l-10-6M50 16l10-6"></path></g></svg>
<div style="flex: 1"><div style="font-size: 22px; line-height: 26px; font-weight: 700">Dead bug</div><div style="font-size: 13px">Set 1 of 2 · 30 sec</div></div></div>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 24px"><a href="m3-player.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500"><span class="ms" aria-hidden="true" style=" font-size: 20px; width: 20px; height: 20px;">skip_next</span> Skip rest</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.dark ?? true) ? 'dark' : '' };
  }
}
</script>
</body>
</html>
