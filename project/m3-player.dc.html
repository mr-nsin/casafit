<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 session player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 8px 16px 20px; display: flex; flex-direction: column">

    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-home.dc.html" aria-label="End session" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">close</span></a>
      <div style="text-align: center">
        <div style="font-size: 12px; font-weight: 500; color: var(--p); letter-spacing: 0.5px">MOVE 3 OF 5</div>
        <div style="font-size: 16px; font-weight: 600">Core + Glutes 15</div>
      </div>
      <a href="m3-editor.dc.html" aria-label="Edit session" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">tune</span></a>
    </div>

    <div aria-label="Session progress" style="margin-top: 4px; display: flex; gap: 3px; height: 6px">
      <div style="flex: 2; background: var(--t); border-radius: 3px"></div>
      <div style="flex: 2.2; background: var(--p); border-radius: 3px"></div>
      <div style="flex: 2.2; background: var(--p); border-radius: 3px"></div>
      <div style="flex: 2.2; background: linear-gradient(90deg, var(--p) 40%, var(--sv) 40%); border-radius: 3px"></div>
      <div style="flex: 2.2; background: var(--sv); border-radius: 3px"></div>
      <div style="flex: 2.2; background: var(--sv); border-radius: 3px"></div>
      <div style="flex: 2; background: var(--sv); border-radius: 3px"></div>
    </div>

    <div style="margin-top: 14px; position: relative; height: 220px; border-radius: 28px; background: var(--tc); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; width: 190px; height: 190px; border-radius: 50%; background: var(--c4); opacity: 0.5; right: -40px; top: -50px"></div>
      <svg style="position: absolute; left: 50%; top: 44px; transform: translateX(-50%)" width="270" height="150" viewBox="0 0 270 150" role="img" aria-label="Bird dog demo: on hands and knees, one arm and the opposite leg reaching long">
        <g fill="none" stroke="var(--otc)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
          <path d="M95 74 L175 74"></path>
          <path d="M100 76 L100 140"></path>
          <path d="M172 76 L172 112 L196 140"></path>
          <path d="M95 72 L30 56"></path>
          <path d="M175 74 L248 66"></path>
        </g>
        <circle cx="78" cy="58" r="14" fill="var(--otc)"></circle>
      </svg>
      <span style="position: absolute; left: 12px; top: 12px; height: 32px; padding: 0 12px; display: flex; align-items: center; border-radius: 8px; background: var(--bg); color: var(--on); font-size: 13px; font-weight: 500">Set 1 of 2 · Right side</span>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: flex-end; justify-content: space-between">
      <div style="padding-left: 4px">
        <div style="font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.4px">Bird dog</div>
        <div style="margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--osv)">Keep your hips level. Reach long.</div>
      </div>
      <div style="text-align: right">
        <div style="font-size: 72px; line-height: 68px; font-weight: 700; letter-spacing: -2px; color: var(--p)">0:28</div>
        <div style="margin-top: 4px; font-size: 12px; font-weight: 500; color: var(--osv)">Work · 9:42 left</div>
      </div>
    </div>

    <div role="radiogroup" aria-label="Intensity" style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 48px; border: 1px solid var(--ol); border-radius: 24px; overflow: hidden">
      <button role="radio" aria-checked="false" style="border: 0; background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Easier</button>
      <button role="radio" aria-checked="true" style="border: 0; border-left: 1px solid var(--ol); border-right: 1px solid var(--ol); background: var(--sc); color: var(--osc); display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>As planned</button>
      <button role="radio" aria-checked="false" style="border: 0; background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Harder</button>
    </div>
    <div style="margin-top: 6px; text-align: center; font-size: 12px; color: var(--osv)">Changes start from the next set and shape next week</div>

    <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <button aria-label="Previous exercise" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: var(--c3); color: var(--on); display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true">skip_previous</span></button>
      <button aria-label="Pause" style="width: 96px; height: 96px; border-radius: 32px; border: 0; background: var(--p); color: var(--op); display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true" style="font-size: 44px; width: 44px; height: 44px">pause</span></button>
      <button aria-label="Skip exercise" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: var(--c3); color: var(--on); display: flex; align-items: center; justify-content: center"><span class="ms f" aria-hidden="true">skip_next</span></button>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 1.7fr; gap: 8px">
      <button style="height: 52px; border-radius: 16px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">+15s rest</button>
      <button style="height: 52px; border-radius: 16px; border: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">+30s rest</button>
      <a href="m3-form.dc.html" style="height: 52px; box-sizing: border-box; border-radius: 16px; background: var(--sc); color: var(--osc); text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500"><span class="ms" aria-hidden="true" style="font-size: 20px; width: 20px; height: 20px">photo_camera</span>Check form · 2 left</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: (this.props.dark ?? true) ? 'dark' : '' };
  }
}
</script>
</body>
</html>
