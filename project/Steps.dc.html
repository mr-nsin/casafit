<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily steps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.d{font-family:'Anton',Impact,sans-serif;font-weight:400}
.h{font-family:'Baloo 2',sans-serif;font-weight:800}
a{color:#15121F}a:hover{color:#3046FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #C6F432; font-family: 'Bricolage Grotesque', sans-serif; color: #15121F">

  <div aria-hidden="true" style="position: absolute; left: -60px; top: 90px; width: 220px; height: 220px; border-radius: 50%; background-image: repeating-radial-gradient(circle, #15121F 0 2px, transparent 2px 12px); opacity: 0.18"></div>

  <div style="position: relative; padding: 20px 18px 0; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Home.dc.html" aria-label="Back to home" style="width: 44px; height: 44px; border-radius: 50%; background: #FFF; border: 2px solid #15121F; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
      </a>
      <h1 class="d" style="margin: 0; font-size: 32px; text-transform: uppercase">Daily steps</h1>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: center; gap: 14px">
      <div style="position: relative; width: 200px; height: 200px; flex: none">
        <svg width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="4,820 of 7,000 steps today">
          <circle cx="100" cy="100" r="82" fill="#FFF" stroke="#15121F" stroke-width="3"></circle>
          <circle cx="100" cy="100" r="70" fill="none" stroke="#EFE7FF" stroke-width="22"></circle>
          <circle cx="100" cy="100" r="70" fill="none" stroke="#3046FF" stroke-width="22" stroke-linecap="round" stroke-dasharray="303 440" transform="rotate(-90 100 100)"></circle>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span class="d" style="font-size: 40px; line-height: 1">4,820</span>
          <span style="font-size: 13px; font-weight: 800">of 7,000</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="background: #15121F; color: #FFF; border-radius: 20px; padding: 12px; box-shadow: 4px 4px 0 #FF4F9A">
          <div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #C6F432">BRISK MINUTES</div>
          <div><span class="d" style="font-size: 34px">12</span><span style="font-size: 14px; font-weight: 600"> / 20</span></div>
        </div>
        <div class="h" style="align-self: flex-start; background: #FFB627; border: 2px solid #15121F; border-radius: 999px; padding: 4px 12px 0; font-size: 17px; transform: rotate(-4deg)">2,180 बाकी</div>
      </div>
    </div>

    <div style="margin-top: 14px; background: #FFF; border: 2px solid #15121F; border-radius: 22px; padding: 12px 14px">
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: 1.2px"><span>THIS WEEK</span><span>GOAL 7,000</span></div>
      <div role="img" aria-label="Steps this week: Tuesday to Sunday last week and today" style="margin-top: 10px; position: relative; height: 84px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end">
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 59px; border-top: 2px dashed #15121F"></div>
        <div style="height: 50px; background: #EFE7FF; border: 2px solid #15121F; border-radius: 8px 8px 0 0"></div>
        <div style="height: 76px; background: #3046FF; border: 2px solid #15121F; border-radius: 8px 8px 0 0"></div>
        <div style="height: 40px; background: #EFE7FF; border: 2px solid #15121F; border-radius: 8px 8px 0 0"></div>
        <div style="height: 62px; background: #3046FF; border: 2px solid #15121F; border-radius: 8px 8px 0 0"></div>
        <div style="height: 34px; background: #EFE7FF; border: 2px solid #15121F; border-radius: 8px 8px 0 0"></div>
        <div style="height: 66px; background: #3046FF; border: 2px solid #15121F; border-radius: 8px 8px 0 0"></div>
        <div style="height: 44px; background: #FF4F9A; border: 2px solid #15121F; border-radius: 8px 8px 0 0"></div>
      </div>
      <div style="margin-top: 4px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center; font-size: 11px; font-weight: 800"><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span><span>TODAY</span></div>
    </div>

    <div style="margin-top: 14px; font-size: 12px; font-weight: 800; letter-spacing: 1.5px">WALK MODES</div>
    <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 12px; align-items: center; background: #FFF; border: 2px solid #15121F; border-radius: 18px; padding: 10px 12px">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: #C6F432; border: 2px solid #15121F; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="M13 7l-2 6 3 3v5M11 13l-3 7M12 9l4 2"></path></svg></span>
        <span style="flex: 1"><span style="display: block; font-weight: 800; font-size: 15px">Normal walk</span><span style="font-size: 13px; color: #4A4458">Counted all day in the background</span></span>
        <span style="font-size: 12px; font-weight: 800; background: #15121F; color: #C6F432; border-radius: 999px; padding: 4px 10px">ON</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; background: #FFF; border: 2px solid #15121F; border-radius: 18px; padding: 10px 12px">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: #FF4F9A; border: 2px solid #15121F; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span>
        <span style="flex: 1"><span style="display: block; font-weight: 800; font-size: 15px">Brisk walk</span><span style="font-size: 13px; color: #4A4458">About 100 steps a minute or faster</span></span>
        <span style="font-size: 12px; font-weight: 800; background: #15121F; color: #C6F432; border-radius: 999px; padding: 4px 10px">ON</span>
      </div>
      <button style="display: flex; gap: 12px; align-items: center; text-align: left; background: #15121F; color: #FFF; border: 2px solid #15121F; border-radius: 18px; padding: 10px 12px; font-family: 'Bricolage Grotesque', sans-serif">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: #FFB627; border: 2px solid #FFF; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H6M10 6l-6 6 6 6"></path></svg></span>
        <span style="flex: 1"><span style="display: block; font-weight: 800; font-size: 15px">Reverse walk</span><span style="font-size: 13px; color: #D9D3E8">Opt-in. Safety check first, 15 min a day max</span></span>
        <span style="font-size: 12px; font-weight: 800; border: 2px solid #FFF; border-radius: 999px; padding: 3px 10px">Try</span>
      </button>
    </div>
    <div style="margin-top: 10px; font-size: 12px; font-weight: 600; color: #15121F">No GPS. Counted by your phone's step sensor or Health Connect.</div>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #FFF; border-top: 3px solid #15121F; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 10px 18px 22px; box-sizing: border-box">
    <a href="Home.dc.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; gap: 8px; background: #15121F; color: #C6F432; border-radius: 999px; text-decoration: none; font-weight: 800; font-size: 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C6F432" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"></path></svg>Workout
    </a>
    <a href="Nutrition.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #15121F; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 16px; border: 2px solid #15121F">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15121F" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 12h16a8 8 0 0 1-16 0zM8 8c0-2 2-2 2-4M13 8c0-2 2-2 2-4"></path></svg>Nutrition
    </a>
