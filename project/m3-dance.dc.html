<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 dance routine player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes beat{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 8px 16px 20px; display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-endsession.dc.html" aria-label="End session" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">close</span></a>
      <div style="text-align: center"><div style="font-size: 12px; font-weight: 500; color: var(--p)">Step 2 of 6</div><div style="font-size: 16px; font-weight: 600">Dance cardio 15</div></div>
      <a href="m3-editor.dc.html" aria-label="Edit session" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">tune</span></a>
    </div>
    <div aria-label="Routine progress" style="margin-top: 4px; display: flex; gap: 3px; height: 6px"><div style="flex: 1; background: var(--t); border-radius: 3px"></div><div style="flex: 1; background: linear-gradient(90deg, var(--p) 55%, var(--sv) 55%); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div></div>

    <div style="margin-top: 14px; position: relative; height: 250px; border-radius: 28px; background: var(--pc); color: var(--opc); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; width: 200px; height: 200px; border-radius: 50%; background: var(--sc); right: -50px; top: -60px"></div>
      <svg style="position: absolute; left: 50%; top: 22px; margin-left: -90px; transform-origin: 90px 120px; animation: sway 1.6s ease-in-out infinite" width="180" height="200" viewBox="0 0 180 200" role="img" aria-label="Grapevine step: arms bent, feet crossing to the side">
        <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M90 58v58"></path><path d="M90 74L48 62 36 90"></path><path d="M90 74l42 14 14-28"></path><path d="M90 116L62 152 46 184"></path><path d="M90 116l30 34 26 30"></path></g>
        <circle cx="90" cy="36" r="17" fill="currentColor"></circle>
      </svg>
      <span style="position: absolute; left: 12px; top: 12px; height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 8px; background: var(--bg); color: var(--on); font-size: 13px; font-weight: 500"><span class="ms f" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">music_note</span>Beat 112</span>
      <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; bottom: 14px; display: flex; align-items: flex-end; gap: 6px; height: 36px"><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out infinite"></span><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out .09s infinite"></span><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out .18s infinite"></span><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out .27s infinite"></span><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out .36s infinite"></span><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out .45s infinite"></span><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out .54s infinite"></span><span style="flex: 1; height: 100%; border-radius: 3px; background: var(--p); transform-origin: bottom; animation: beat .54s ease-in-out .63s infinite"></span></div>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: flex-end; justify-content: space-between">
      <div style="padding-left: 4px"><div style="font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.4px">Grapevine</div><div style="margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--osv)">Step right, cross behind, step right, tap.</div></div>
      <div style="text-align: right"><div role="timer" style="font-size: 56px; line-height: 56px; font-weight: 700; letter-spacing: -1.5px; color: var(--p)">0:48</div><div style="margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--osv)">Routine · 7:20 left</div></div>
    </div>

    <div role="radiogroup" aria-label="Impact" style="margin-top: 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 48px; border: 1px solid var(--ol); border-radius: 24px; overflow: hidden">
      <button role="radio" aria-checked="true" style="border: 0; background: var(--sc); color: var(--osc); display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>Low impact</button>
      <button role="radio" aria-checked="false" style="border: 0; border-left: 1px solid var(--ol); background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">High impact</button>
    </div>
    <div style="margin-top: 6px; text-align: center; font-size: 12px; color: var(--osv)">Low impact has no jumping. Switch any time.</div>

    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <a href="m3-dance.dc.html" aria-label="Previous step" style="width: 56px; height: 56px; border-radius: 28px; background: var(--c3); color: var(--on); display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="ms f" aria-hidden="true">skip_previous</span></a>
      <a href="m3-paused.dc.html" aria-label="Pause" style="width: 88px; height: 88px; border-radius: 30px; background: var(--p); color: var(--op); display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="ms f" aria-hidden="true" style="font-size: 40px; width: 40px; height: 40px">pause</span></a>
      <a href="m3-dance.dc.html" aria-label="Next step" style="width: 56px; height: 56px; border-radius: 28px; background: var(--c3); color: var(--on); display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="ms f" aria-hidden="true">skip_next</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
