<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 desk reset</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes grow{from{stroke-dasharray:0 1000}}
@keyframes sway{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 8px 16px 24px; display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-home.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">close</span></a>
      <div style="text-align: center"><div style="font-size: 12px; font-weight: 500; color: var(--p)">Move 2 of 4</div><div style="font-size: 16px; font-weight: 600">Desk reset · 4 min</div></div>
      <span style="width: 48px"></span>
    </div>

    <div style="margin-top: 8px; position: relative; height: 230px; border-radius: 28px; background: var(--tc); color: var(--otc); overflow: hidden; display: flex; align-items: center; justify-content: center">
      <svg width="230" height="180" viewBox="0 0 230 180" role="img" aria-label="Seated neck stretch: head tilting gently to one side">
        <path d="M30 170h170" stroke="currentColor" stroke-opacity=".25" stroke-width="8" stroke-linecap="round"></path>
        <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M110 76v52M110 128l-34 12v28M110 128l40 8v32M110 92L72 112M110 92l36 16"></path></g>
        <g style="transform-origin: 110px 70px; animation: sway 3s ease-in-out infinite"><circle cx="110" cy="52" r="17" fill="currentColor"></circle></g>
      </svg>
      <span style="position: absolute; left: 12px; top: 12px; height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border-radius: 8px; background: var(--bg); color: var(--on); font-size: 13px; font-weight: 500"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">volume_off</span>Quiet · no sweat</span>
    </div>

    <div style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between">
      <div style="padding-left: 4px"><div style="font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.4px">Neck release</div><div style="margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--osv)">Let your ear drift to your shoulder. Keep both shoulders low.</div></div>
    </div>

    <div style="margin-top: 16px; display: flex; align-items: center; gap: 16px; background: var(--c3); border-radius: 24px; padding: 14px 18px">
      <div style="position: relative; width: 84px; height: 84px; flex: none"><svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="20 seconds of a 30 second hold"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--sv)" stroke-width="9"></circle><circle cx="42" cy="42" r="34" fill="none" stroke="var(--p)" stroke-width="9" stroke-linecap="round" stroke-dasharray="142 214" transform="rotate(-90 42 42)" style="animation: grow 1.3s cubic-bezier(.2,0,0,1) both"></circle></svg><div role="timer" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">0:20</div></div>
      <div><div style="font-size: 12px; font-weight: 500; color: var(--osv)">Left side</div><div style="font-size: 18px; line-height: 24px; font-weight: 600">Then switch sides</div></div>
    </div>

    <div style="margin-top: 12px; display: flex; gap: 12px; align-items: center; background: var(--sc); color: var(--osc); border-radius: 18px; padding: 12px 16px; font-size: 14px; line-height: 20px"><span class="ms f" aria-hidden="true">lightbulb</span>Short breaks add up. They count toward your active minutes, not your 15-minute session.</div>

    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px">
      <a href="m3-home.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border-radius: 28px; border: 1px solid var(--ol); color: var(--p); text-decoration: none; font-size: 16px; font-weight: 500">Skip</a>
      <a href="m3-desk.dc.html" style="height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 28px; background: var(--p); color: var(--op); text-decoration: none; font-size: 16px; font-weight: 500"><span class="ms f" aria-hidden="true">skip_next</span>Next move</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
