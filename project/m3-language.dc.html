<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 language and voice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Noto+Sans+Devanagari:wght@400;600&amp;family=Noto+Sans+Tamil:wght@400;600&amp;family=Noto+Sans+Telugu:wght@400;600&amp;family=Noto+Sans+Bengali:wght@400;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
.native{font-family:'Roboto Flex','Noto Sans Devanagari','Noto Sans Tamil','Noto Sans Telugu','Noto Sans Bengali',sans-serif;line-height:1.5}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="box-sizing: border-box; padding: 8px 16px 0; display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center; gap: 4px"><a href="m3-profile.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">arrow_back</span></a><h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Language and voice</h1></div>
    <p style="margin: 0 8px; font-size: 14px; line-height: 20px; color: var(--osv)">The app and your voice coach use the same language. Exercise names stay in English with a short local explanation.</p>

    <div role="radiogroup" aria-label="Language" style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
      <button role="radio" aria-checked="true" style="width: 100%; border: 0; text-align: left; font: inherit; color: inherit; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 18px; background: var(--sc); color: var(--osc)"><span class="ms f" aria-hidden="true">radio_button_checked</span><span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 600">English</span><span style="display: block; font-size: 13px">App and voice coach</span></span></button>
      <button role="radio" aria-checked="false" style="width: 100%; border: 0; text-align: left; font: inherit; color: inherit; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 18px; background: var(--c3)"><span class="ms" aria-hidden="true" style="color: var(--osv)">radio_button_unchecked</span><span style="flex: 1"><span class="native" lang="hi" style="display: block; font-size: 17px; font-weight: 600">हिन्दी</span><span style="display: block; font-size: 13px; color: var(--osv)">Hindi · app and voice coach</span></span><span style="height: 28px; padding: 0 10px; display: flex; align-items: center; border-radius: 8px; background: var(--tc); color: var(--otc); font-size: 12px; font-weight: 600">New</span></button>
      <button role="radio" aria-checked="false" style="width: 100%; border: 0; text-align: left; font: inherit; color: inherit; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 18px; background: var(--c3)"><span class="ms" aria-hidden="true" style="color: var(--osv)">radio_button_unchecked</span><span style="flex: 1"><span class="native" lang="ta" style="display: block; font-size: 17px; font-weight: 600">தமிழ்</span><span style="display: block; font-size: 13px; color: var(--osv)">Tamil · app only, voice coming soon</span></span></button>
      <button role="radio" aria-checked="false" style="width: 100%; border: 0; text-align: left; font: inherit; color: inherit; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 18px; background: var(--c3)"><span class="ms" aria-hidden="true" style="color: var(--osv)">radio_button_unchecked</span><span style="flex: 1"><span class="native" lang="te" style="display: block; font-size: 17px; font-weight: 600">తెలుగు</span><span style="display: block; font-size: 13px; color: var(--osv)">Telugu · app only, voice coming soon</span></span></button>
      <button role="radio" aria-checked="false" style="width: 100%; border: 0; text-align: left; font: inherit; color: inherit; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 18px; background: var(--c3)"><span class="ms" aria-hidden="true" style="color: var(--osv)">radio_button_unchecked</span><span style="flex: 1"><span class="native" lang="mr" style="display: block; font-size: 17px; font-weight: 600">मराठी</span><span style="display: block; font-size: 13px; color: var(--osv)">Marathi · app only, voice coming soon</span></span></button>
      <button role="radio" aria-checked="false" style="width: 100%; border: 0; text-align: left; font: inherit; color: inherit; min-height: 64px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border-radius: 18px; background: var(--c3)"><span class="ms" aria-hidden="true" style="color: var(--osv)">radio_button_unchecked</span><span style="flex: 1"><span class="native" lang="bn" style="display: block; font-size: 17px; font-weight: 600">বাংলা</span><span style="display: block; font-size: 13px; color: var(--osv)">Bengali · app only, voice coming soon</span></span></button>
    </div>

    <div style="margin-top: 12px; display: flex; gap: 12px; align-items: center; background: var(--tc); color: var(--otc); border-radius: 18px; padding: 12px 16px; font-size: 14px; line-height: 20px"><span class="ms f" aria-hidden="true">record_voice_over</span><span class="native" lang="hi">Preview: "घुटनों को बाहर रखें" · Knees out</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
