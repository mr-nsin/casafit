<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Baloo+2:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.d{font-family:'Anton',Impact,sans-serif;font-weight:400}
.h{font-family:'Baloo 2',sans-serif;font-weight:800}
a{color:#FFF}a:hover{color:#C6F432}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: #15121F; font-family: 'Bricolage Grotesque', sans-serif; color: #FFF">
  <div style="position: relative; height: 100%; box-sizing: border-box; padding: 20px 18px 24px; display: flex; flex-direction: column">

    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Home.dc.html" aria-label="End session" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #FFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <div style="text-align: center">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 1.5px; color: #C6F432">MOVE 3 OF 5</div>
        <div style="font-weight: 800; font-size: 17px">Core + Glutes 15</div>
      </div>
      <a href="Editor.dc.html" aria-label="Edit session" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid #FFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M4 12h16M4 17h7"></path><circle cx="17" cy="7" r="2.5"></circle><circle cx="14" cy="17" r="2.5"></circle></svg>
      </a>
    </div>

    <div aria-label="Session progress" style="margin-top: 14px; display: flex; gap: 4px; height: 10px">
      <div style="flex: 2; background: #C6F432; border-radius: 5px"></div>
      <div style="flex: 2.2; background: #FF4F9A; border-radius: 5px"></div>
      <div style="flex: 2.2; background: #FF4F9A; border-radius: 5px"></div>
      <div style="flex: 2.2; background: linear-gradient(90deg, #FF4F9A 40%, #3A3252 40%); border-radius: 5px"></div>
      <div style="flex: 2.2; background: #3A3252; border-radius: 5px"></div>
      <div style="flex: 2.2; background: #3A3252; border-radius: 5px"></div>
      <div style="flex: 2; background: #3A3252; border-radius: 5px"></div>
    </div>

    <div style="margin-top: 14px; position: relative; height: 236px; border-radius: 30px; background: #FF4F9A; border: 3px solid #FFF; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; background-image: radial-gradient(#15121F 1.3px, transparent 1.5px); background-size: 14px 14px; opacity: 0.35"></div>
      <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: #FFB627; border-top: 3px solid #15121F"></div>
      <svg style="position: absolute; left: 50%; top: 40px; transform: translateX(-50%)" width="270" height="160" viewBox="0 0 270 160" role="img" aria-label="Bird dog demo: on hands and knees, one arm and the opposite leg reaching long">
        <g fill="none" stroke="#15121F" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
          <path d="M95 82 L175 82"></path>
          <path d="M100 84 L100 148"></path>
          <path d="M172 84 L172 120 L196 148"></path>
          <path d="M95 80 L30 64"></path>
          <path d="M175 82 L248 74"></path>
        </g>
        <circle cx="78" cy="66" r="15" fill="#15121F"></circle>
      </svg>
      <span style="position: absolute; left: 14px; top: 14px; background: #15121F; color: #FFF; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800">Set 1 of 2 · Right side</span>
      <span class="h" style="position: absolute; right: 14px; top: 12px; background: #C6F432; color: #15121F; border: 2px solid #15121F; border-radius: 999px; padding: 3px 12px 0; font-size: 18px; transform: rotate(4deg)">शाबाश</span>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: flex-end; justify-content: space-between">
      <div>
        <div class="d" style="font-size: 40px; line-height: 1; text-transform: uppercase">Bird dog</div>
        <div style="margin-top: 6px; font-size: 15px; font-weight: 600; color: #D9D3E8">"Keep your hips level. Reach long."</div>
      </div>
      <div style="text-align: right">
        <div class="d" style="font-size: 82px; line-height: 0.85; color: #FFB627">0:28</div>
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 1px; margin-top: 4px">WORK · 9:42 LEFT</div>
      </div>
    </div>

    <div role="radiogroup" aria-label="Intensity" style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border: 2px solid #FFF; border-radius: 999px">
      <button role="radio" aria-checked="false" style="height: 46px; border: 0; border-radius: 999px; background: transparent; color: #FFF; font: 600 15px 'Bricolage Grotesque', sans-serif">Easier</button>
      <button role="radio" aria-checked="true" style="height: 46px; border: 0; border-radius: 999px; background: #FFF; color: #15121F; font: 800 15px 'Bricolage Grotesque', sans-serif">As planned</button>
      <button role="radio" aria-checked="false" style="height: 46px; border: 0; border-radius: 999px; background: transparent; color: #FFF; font: 600 15px 'Bricolage Grotesque', sans-serif">Harder</button>
    </div>
    <div style="margin-top: 6px; text-align: center; font-size: 12px; color: #D9D3E8">Changes start from the next set and shape next week</div>

    <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Previous exercise" style="width: 60px; height: 60px; border-radius: 50%; background: transparent; border: 2px solid #FFF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5L8 12l10 7z" fill="#FFF"></path><rect x="5" y="5" width="3" height="14" fill="#FFF"></rect></svg>
      </button>
      <button aria-label="Pause" style="width: 96px; height: 96px; border-radius: 50%; background: #C6F432; border: 4px solid #FFF; box-shadow: 0 0 0 6px #3046FF; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#15121F"></rect><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#15121F"></rect></svg>
      </button>
      <button aria-label="Skip exercise" style="width: 60px; height: 60px; border-radius: 50%; background: transparent; border: 2px solid #FFF; display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l10 7-10 7z" fill="#FFF"></path><rect x="16" y="5" width="3" height="14" fill="#FFF"></rect></svg>
      </button>
    </div>

    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px">
      <button style="height: 52px; border-radius: 16px; background: #2A2340; border: 2px solid #4A3F6B; color: #FFF; font: 800 15px 'Bricolage Grotesque', sans-serif">+15s rest</button>
      <button style="height: 52px; border-radius: 16px; background: #2A2340; border: 2px solid #4A3F6B; color: #FFF; font: 800 15px 'Bricolage Grotesque', sans-serif">+30s rest</button>
      <a href="FormCheck.dc.html" style="height: 52px; box-sizing: border-box; border-radius: 16px; background: #3046FF; border: 2px solid #FFF; color: #FFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 14px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        Check form · 2 left
      </a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
