<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasaFit M3 yoga flow player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.m3{--p:#9C4400;--op:#FFFFFF;--pc:#FFDBC8;--opc:#331200;--s:#765849;--os:#FFFFFF;--sc:#FFDBCA;--osc:#2B1609;--t:#5F6219;--ot:#FFFFFF;--tc:#E4E790;--otc:#1B1D00;--bg:#FFF8F5;--on:#221A15;--sv:#F4DED3;--osv:#52443B;--ol:#85736A;--olv:#D7C2B8;--c1:#FFF1EA;--c2:#FCEBE1;--c3:#F6E5DB;--c4:#F0DFD5;--er:#BA1A1A;--erc:#FFDAD6;--eoc:#410002}
.m3.dark{--p:#FFB68E;--op:#552100;--pc:#793100;--opc:#FFDBC8;--s:#E6BEAB;--os:#432B1D;--sc:#5C4130;--osc:#FFDBCA;--t:#C8CB77;--ot:#303300;--tc:#464900;--otc:#E4E790;--bg:#1A120D;--on:#F0DFD5;--sv:#52443B;--osv:#D7C2B8;--ol:#9F8D83;--olv:#52443B;--c1:#221A15;--c2:#271E19;--c3:#322823;--c4:#3D332D;--er:#FFB4AB;--erc:#93000A;--eoc:#FFDAD6}
.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;letter-spacing:normal;text-transform:none;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.ms.f{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
a{color:var(--p)}
.m3{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.m3 a,.m3 button{transition:transform .2s cubic-bezier(.2,0,0,1),filter .2s,background-color .25s,box-shadow .2s}
.m3 a:hover,.m3 button:hover{filter:brightness(.96)}
.m3.dark a:hover,.m3.dark button:hover{filter:brightness(1.12)}
.m3 a:active,.m3 button:active{transform:scale(.97)}
.m3 a:focus-visible,.m3 button:focus-visible{outline:3px solid var(--p);outline-offset:3px}
@keyframes grow{from{stroke-dasharray:0 1000}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes fa{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes fb{0%,49.9%{opacity:0}50%,100%{opacity:1}}
@keyframes hold{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes tilt{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.fa{animation:fa 1.8s infinite}
.fb{opacity:0;animation:fb 1.8s infinite}
@media (prefers-reduced-motion:reduce){.m3 *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="m3 {{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; background: var(--bg); color: var(--on); font-family: 'Roboto Flex', sans-serif">
  <div style="height: 100%; box-sizing: border-box; padding: 8px 16px 20px; display: flex; flex-direction: column">
    <div style="height: 56px; display: flex; align-items: center; justify-content: space-between">
      <a href="m3-endsession.dc.html" aria-label="End session" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">close</span></a>
      <div style="text-align: center"><div style="font-size: 12px; font-weight: 500; color: var(--p)">Pose 4 of 9</div><div style="font-size: 16px; font-weight: 600">Yoga flow 15</div></div>
      <a href="m3-editor.dc.html" aria-label="Edit session" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: var(--on); text-decoration: none"><span class="ms" aria-hidden="true">tune</span></a>
    </div>
    <div aria-label="Session progress" style="margin-top: 4px; display: flex; gap: 3px; height: 6px"><div style="flex: 1; background: var(--t); border-radius: 3px"></div><div style="flex: 1; background: var(--t); border-radius: 3px"></div><div style="flex: 1; background: var(--t); border-radius: 3px"></div><div style="flex: 1; background: var(--p); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div><div style="flex: 1; background: var(--sv); border-radius: 3px"></div></div>

    <div style="margin-top: 14px; position: relative; height: 260px; border-radius: 28px; background: var(--tc); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; width: 220px; height: 220px; border-radius: 50%; background: var(--c4); opacity: .55; left: 50%; top: 30px; margin-left: -110px; animation: breathe 8s ease-in-out infinite"></div>
      <svg style="position: absolute; left: 50%; top: 18px; transform: translateX(-50%)" width="232" height="232" viewBox="0 0 200 200" role="img" aria-label="Warrior two pose: wide stance, front knee bent, arms long to both sides"><g style="transform-origin: 100px 180px; animation: hold 6s ease-in-out infinite"><path d="M100 124L48 180" stroke="var(--osc)" stroke-width="16" stroke-linecap="round"></path><path d="M100 124L140 148L148 180" fill="none" stroke="var(--osc)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"></path><path d="M40 181h12" stroke="var(--t)" stroke-width="9" stroke-linecap="round"></path><path d="M147 181h12" stroke="var(--t)" stroke-width="9" stroke-linecap="round"></path><path d="M100 80V122" stroke="var(--p)" stroke-width="30" stroke-linecap="round"></path><path d="M28 84H172" stroke="#8D5524" stroke-width="10" stroke-linecap="round"></path><circle cx="100" cy="56" r="14" fill="#8D5524"></circle><path d="M86 56a14 14 0 0 1 28 -3c-6-8-19-9-28 3z" fill="#2A1A12"></path><circle cx="100" cy="38" r="7" fill="#2A1A12"></circle></g></svg>
      <span style="position: absolute; left: 12px; top: 12px; height: 32px; padding: 0 12px; display: flex; align-items: center; border-radius: 8px; background: var(--bg); color: var(--on); font-size: 13px; font-weight: 500">Right side</span>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: flex-end; justify-content: space-between">
      <div style="padding-left: 4px"><div style="font-size: 32px; line-height: 38px; font-weight: 800; letter-spacing: -0.4px">Warrior II</div><div style="margin-top: 4px; font-size: 14px; line-height: 20px; color: var(--osv)">Sink into the front knee. Reach both arms long.</div></div>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: center; gap: 16px; background: var(--c3); border-radius: 24px; padding: 14px 18px">
      <div style="position: relative; width: 84px; height: 84px; flex: none"><svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="34 seconds of a 45 second hold"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--sv)" stroke-width="9"></circle><circle cx="42" cy="42" r="34" fill="none" stroke="var(--p)" stroke-width="9" stroke-linecap="round" stroke-dasharray="162 214" transform="rotate(-90 42 42)" style="animation: grow 1.3s cubic-bezier(.2,0,0,1) both"></circle></svg><div role="timer" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">0:34</div></div>
      <div><div style="font-size: 12px; font-weight: 500; color: var(--osv)">Hold</div><div style="font-size: 20px; line-height: 26px; font-weight: 600">Breathe in for 4</div><div style="font-size: 13px; color: var(--osv)">Then out for 6</div></div>
    </div>

    <div role="radiogroup" aria-label="Pose depth" style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 48px; border: 1px solid var(--ol); border-radius: 24px; overflow: hidden">
      <button role="radio" aria-checked="false" style="border: 0; background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Gentler</button>
      <button role="radio" aria-checked="true" style="border: 0; border-left: 1px solid var(--ol); border-right: 1px solid var(--ol); background: var(--sc); color: var(--osc); display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 14px 'Roboto Flex', sans-serif"><span class="ms" aria-hidden="true" style="font-size: 18px; width: 18px; height: 18px">check</span>As planned</button>
      <button role="radio" aria-checked="false" style="border: 0; background: transparent; color: var(--on); font: 500 14px 'Roboto Flex', sans-serif">Deeper</button>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
      <a href="m3-yoga.dc.html" aria-label="Previous pose" style="width: 56px; height: 56px; border-radius: 28px; background: var(--c3); color: var(--on); display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="ms f" aria-hidden="true">skip_previous</span></a>
      <a href="m3-paused.dc.html" aria-label="Pause" style="width: 88px; height: 88px; border-radius: 30px; background: var(--p); color: var(--op); display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="ms f" aria-hidden="true" style="font-size: 40px; width: 40px; height: 40px">pause</span></a>
      <a href="m3-yoga.dc.html" aria-label="Next pose" style="width: 56px; height: 56px; border-radius: 28px; background: var(--c3); color: var(--on); display: flex; align-items: center; justify-content: center; text-decoration: none"><span class="ms f" aria-hidden="true">skip_next</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
